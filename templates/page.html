<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#fbfaf6; --fg:#1f2420; --muted:#5e665f; --line:#d9ddd3; --panel:#f1f3ec;
  --accent:#4f6d3a; --accent-ink:#ffffff; --gate:#9a5b1e; --gate-bg:#f6e9d8;
  --ok:#3f7a4a; --warn:#b4762a; --code-bg:#eef0e9;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15181a; --fg:#e6e8e3; --muted:#9aa39a; --line:#2d3330; --panel:#1c2124;
  --accent:#9bbd7a; --accent-ink:#121612; --gate:#e0a460; --gate-bg:#2a2118;
  --ok:#8fc79a; --warn:#e0a460; --code-bg:#1b1f22; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15181a; --fg:#e6e8e3; --muted:#9aa39a; --line:#2d3330; --panel:#1c2124;
  --accent:#9bbd7a; --accent-ink:#121612; --gate:#e0a460; --gate-bg:#2a2118;
  --ok:#8fc79a; --warn:#e0a460; --code-bg:#1b1f22; color-scheme:dark }

body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:0 48px}
@media (min-width:1000px){.wrap{grid-template-columns:220px minmax(0,1fr)}}
nav.toc{display:none}
@media (min-width:1000px){nav.toc{display:block;position:sticky;top:24px;align-self:start;padding-top:40px;font-size:14px}
  nav.toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 0;border-left:2px solid var(--line);padding-left:10px}
  nav.toc a:hover{color:var(--fg);border-color:var(--accent)}}
main{min-width:0;max-width:820px}
header{padding-top:40px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:28px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:40px;line-height:1.1;margin:8px 0 10px;font-weight:700;text-wrap:balance}
h2{font-size:26px;margin:44px 0 12px;font-weight:700;text-wrap:balance;scroll-margin-top:20px}
h3{font-size:18px;margin:22px 0 8px;font-weight:600}
p{margin:0 0 12px;max-width:68ch}
ul,ol{margin:0 0 14px;padding-left:22px;max-width:70ch}
li{margin:3px 0}
.lede{font-size:19px;color:var(--muted);max-width:66ch}
.tldr{background:var(--panel);border-left:4px solid var(--accent);padding:16px 20px;margin:0 0 8px;border-radius:0 6px 6px 0}
.tldr h2{margin:0 0 8px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--accent)}
.tldr ul{margin:0;max-width:none}
.frame{background:var(--gate-bg);border-left:4px solid var(--gate);padding:12px 20px 4px;margin:28px 0 8px;border-radius:0 6px 6px 0}
.frame h2{margin:0 0 8px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--gate)}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
pre{font-family:var(--mono);font-size:13px;line-height:1.5;background:var(--code-bg);padding:14px 16px;border-radius:6px;overflow-x:auto;margin:8px 0 16px}
pre code{background:none;padding:0;font-size:inherit}
table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0 18px}
.tablewrap{overflow-x:auto;margin:0 0 16px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td code{white-space:nowrap}
details{border:1px solid var(--line);border-radius:6px;padding:0 14px;margin:8px 0 16px;background:var(--bg)}
details summary{cursor:pointer;padding:10px 0;font-weight:600}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details.section{margin-top:28px}
details.section summary{font-size:20px}
blockquote{margin:0 0 12px;padding:2px 0 2px 14px;border-left:3px solid var(--line);color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.note{font-size:15px;color:var(--muted)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<nav class="toc" aria-label="Sections">
{{toc}}
</nav>
<main>
<header>
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{title}}</h1>
{{lede}}
</header>
{{body}}
</main>
</div>
</body>
</html>
